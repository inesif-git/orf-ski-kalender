name: Update Ski Calendar

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ORF-Kalender aktualisieren
        run: python update_calendar.py

      - name: FIS-Rennkalender pruefen
        run: python pruefe_fis.py

      - name: Kalenderdatei speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ski-weltcup.ics
          if ! git diff --cached --quiet; then
            git commit -m "Kalender automatisch aktualisiert"
            git push
          else
            echo "Keine Kalender-Aenderungen"
          fi
